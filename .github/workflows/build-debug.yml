name: debug-build-and-test

on:
  push:
    branches:
      - "**"
    tags-ignore:
      - 'v*'
  pull_request:
    branches:
      - "**"
  #schedule:
  #  - cron: '*/120 8-18 * * *'  # every 2 hours from 8:00 to 18:00 every day

env:
  WHEEL_DIR: dist/pyCFML/wheel

jobs:

  ##############################################################################
  # JOB 0
  ##############################################################################
  resolve_ci_matrix:

    runs-on: ubuntu-latest

    outputs:
      latest_python_version: ${{ steps.export-pixi.outputs.latest_python_version }}
      latest_ci_environment: ${{ steps.export-pixi.outputs.latest_ci_environment }}

    steps:
      - name: Check-out repository
        uses: actions/checkout@v4

      - name: Export Pixi CI metadata
        id: export-pixi
        shell: bash
        run: python3 tools/export_pixi_ci_matrix.py --github-output >> "$GITHUB_OUTPUT"

  ##############################################################################
  # JOB 1
  ##############################################################################
  build:  # current job name

    needs: resolve_ci_matrix

    timeout-minutes: 30

    # current job matrix. if modified, remember to UPDATE the strategy in the next job
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-14]
        toolchain:
          - { exe: gfortran, compiler: gcc, version: 13 }

    runs-on: ${{ matrix.os }}

    steps: # job steps
      - name: Check-out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history with tags is required for versioningit

      - name: Verify preinstalled GNU toolchain [Ubuntu 24.04]
        if: ${{ runner.os == 'Linux' && matrix.os == 'ubuntu-24.04' && matrix.toolchain.exe == 'gfortran' }}
        shell: bash
        run: |
          gfortran-13 --version
          echo "FC=gfortran-13" >> "$GITHUB_ENV"
          echo "CC=gcc-13" >> "$GITHUB_ENV"
          echo "CXX=g++-13" >> "$GITHUB_ENV"

      - name: Set up Fortran compiler (FC) [all except Windows + gfortran] # except: use pre-installed gfortran
        if: ${{ !(runner.os == 'Linux' && matrix.os == 'ubuntu-24.04' && matrix.toolchain.exe == 'gfortran') && (runner.os != 'Windows' || matrix.toolchain.exe != 'gfortran') }}
        uses: fortran-lang/setup-fortran@v1
        id: setup-fortran
        with:
          compiler: ${{ matrix.toolchain.compiler }}
          version: ${{ matrix.toolchain.version }}

      - name: Set up NMake build tool [Windows]
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Set up Pixi environment for repo-owned validation
        uses: ./.github/actions/setup-pixi
        with:
          environments: ${{ needs.resolve_ci_matrix.outputs.latest_ci_environment }}
          activate-environment: ${{ needs.resolve_ci_matrix.outputs.latest_ci_environment }}
          frozen: true

      - name: Fix reinstalling gcc [macOS]  # needed because of `brew reinstall gcc`
        if: runner.os == 'macOS'
        shell: bash
        run: echo "MACOSX_DEPLOYMENT_TARGET=$(sw_vers -productVersion)" >> $GITHUB_ENV

      - name: Build crysfml wheel with Pixi task
        shell: bash
        run: pixi run --environment "${{ needs.resolve_ci_matrix.outputs.latest_ci_environment }}" pycfml-build

      - name: Fix Python package wheel dependencies
        if: runner.os == 'macOS'
        shell: bash
        run: |
          pip install delocate
          #delocate-wheel -v ${{ env.WHEEL_DIR }}/*.whl

      - name: Test built crysfml wheel
        shell: bash
        run: pixi run --environment "${{ needs.resolve_ci_matrix.outputs.latest_ci_environment }}" pycfml-test

      - name: Upload zipped Python package wheel of pyCFML for next job
        uses: actions/upload-artifact@v4
        with:  # if name or path modified, remember to UPDATE those in the download step of the next job
          name: pycfml-wheel_${{ matrix.os }}_${{ matrix.toolchain.exe }} # name (without .zip) of the zip file to be uploaded
          path: ${{ env.WHEEL_DIR }}  # all files in this directory will be zipped
          if-no-files-found: "error"
          compression-level: 0

  ##############################################################################
  # JOB 2
  ##############################################################################
  test:  # current job name

    needs: [resolve_ci_matrix, build]  # previous job 'build' need to be finished first

    if: always()  # start this job even if the previous job failed

    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-14]
        toolchain:
          - { exe: gfortran, compiler: gcc, version: 13 }

    runs-on: ${{ matrix.os }}

    steps:  # job steps
      - name: Check-out repository
        uses: actions/checkout@v4

      - name: Set up Pixi environment for repo-owned validation
        uses: ./.github/actions/setup-pixi
        with:
          environments: ${{ needs.resolve_ci_matrix.outputs.latest_ci_environment }}
          activate-environment: ${{ needs.resolve_ci_matrix.outputs.latest_ci_environment }}
          frozen: true

      - name: Download zipped pyCFML wheel from previous job
        uses: actions/download-artifact@v4
        with:  # name or path are taken from the upload step of the previous job
          name: pycfml-wheel_${{ matrix.os }}_${{ matrix.toolchain.exe }}  # name (without .zip) of the zipped artifact uploaded on the previous jobs
          path: ${{ env.WHEEL_DIR }}  # directory to extract downloaded zipped artifacts

      - name: Test downloaded pyCFML wheel
        shell: bash
        run: pixi run --environment "${{ needs.resolve_ci_matrix.outputs.latest_ci_environment }}" pycfml-test
