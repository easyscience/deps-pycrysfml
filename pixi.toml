[workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64", "win-64", "linux-64"]

[system-requirements]
macos = "14.0"

[dependencies]
ninja = "*"
numpy = "*"

[feature.py311.dependencies]
python = "3.11.*"

[feature.py312.dependencies]
python = "3.12.*"

[feature.py313.dependencies]
python = "3.13.*"

[feature.py314.dependencies]
python = "3.14.*"

[feature.install-tools.pypi-dependencies]
pip = '*'
packaging = '*'

[feature.build-tools.pypi-dependencies]
build = '*'
wheel = '*'
scikit-build-core = '*'
versioningit = '*'

[feature.test-tools.pypi-dependencies]
pytest = '*'
deepdiff = '*'
matplotlib = '*'

[feature.dev.pypi-dependencies]
crysfml = { path = '.', editable = true }

[feature.ci-tools.pypi-dependencies]
[feature.repair-macos]
platforms = ["osx-arm64"]

[feature.repair-macos.pypi-dependencies]
delocate = '*'

[feature.repair-windows]
platforms = ["win-64"]

[feature.repair-windows.pypi-dependencies]
delvewheel = '*'

[environments]
default = ["install-tools", "build-tools", "test-tools", "dev", "py314"]
wheeltest = ["install-tools", "test-tools", "py314"]
repair-macos = ["install-tools", "test-tools", "repair-macos", "py314"]
repair-windows = ["install-tools", "test-tools", "repair-windows", "py314"]
ci-py311 = ["install-tools", "build-tools", "test-tools", "ci-tools", "py311"]
ci-py312 = ["install-tools", "build-tools", "test-tools", "ci-tools", "py312"]
ci-py313 = ["install-tools", "build-tools", "test-tools", "ci-tools", "py313"]
ci-py314 = ["install-tools", "build-tools", "test-tools", "ci-tools", "py314"]

[tasks.vendor-cfml-refresh]
cmd = "python tools/vendor_cfml.py refresh --force"
description = "Refresh vendored CFML from the default tracked upstream branch"

[tasks.vendor-cfml-refresh-branch]
cmd = "python tools/vendor_cfml.py refresh --force --branch {{ branch }}"
args = [{ arg = "branch", default = "master" }]
description = "Refresh vendored CFML from a specific branch"

[tasks.vendor-cfml-refresh-commit]
cmd = "python tools/vendor_cfml.py refresh --force --branch {{ branch }} --commit {{ commit }}"
args = ["commit", { arg = "branch", default = "master" }]
description = "Refresh vendored CFML from a specific commit"

[tasks.vendor-cfml-stage]
cmd = "python tools/vendor_cfml.py stage"
description = "Configure the repo-owned CFML-only build and stage dist/CFML/lib and dist/CFML/include"

[tasks.vendor-cfml-test]
cmd = "python tools/vendor_cfml.py test"
description = "Configure the repo-owned CFML-only build, restage dist/CFML, and build vendored test programs into dist/CFML/progs"

[tasks.vendor-cfml-validate]
depends-on = [
		{ task = "vendor-cfml-stage", environment = "default" },
		{ task = "vendor-cfml-test", environment = "default" },
	]
description = "Run the non-destructive vendored CFML maintainer validation pipeline"

[tasks.pycfml-build]
cmd = "python tools/build_local_wheel.py --wheel-dir dist/pyCFML/wheel"
description = "Build a local crysfml wheel from the repository root"

[tasks.pycfml-test]
cmd = "python tools/run_installed_wheel_tests.py --wheel-dir dist/pyCFML/wheel"
default-environment = "wheeltest"
description = "Install the built wheel in the clean environment and run tests"

[tasks.sdist-validate]
cmd = "python tools/validate_sdist_rebuild.py --sdist-dir dist/sdist-validation/sdist --wheel-dir dist/sdist-validation/wheel"
description = "Build an sdist, rebuild a wheel from it, and test the rebuilt wheel"

[tasks.validate-wheel-filenames]
cmd = "python tools/validate_pypi_wheel_filenames.py {{ path }}"
args = [{ arg = "path", default = "dist/pyCFML/wheel" }]
description = "Validate wheel filenames against PyPI upload rules"

[tasks.pycfml-repair-diagnostics-macos]
cmd = "python tools/run_repair_diagnostics.py --wheel-dir dist/pyCFML/wheel"
default-environment = "repair-macos"
description = "Repair, validate, and test a locally built wheel on native macOS"

[tasks.pycfml-repair-diagnostics-windows]
cmd = "python tools/run_repair_diagnostics.py --wheel-dir dist/pyCFML/wheel"
default-environment = "repair-windows"
description = "Repair, validate, and test a locally built wheel on native Windows"

[tasks.release-check]
depends-on = [
		{ task = "pycfml-build", environment = "default" },
		{ task = "pycfml-test", environment = "wheeltest" },
		{ task = "sdist-validate", environment = "default" },
	]
description = "Run the mandatory local pre-release validation pipeline"
